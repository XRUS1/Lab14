<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <title>Seguimiento a escala de la habitacion</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }
        #overlay-inicio {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(10, 10, 15, 0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #btn-entrar {
            background-color: #107c10;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        #btn-entrar:active { background-color: #0b520b; }
        #indicaciones {
            font-size: 14px;
            color: #aaa;
            max-width: 320px;
            line-height: 1.5;
        }
        #info {
            position: absolute;
            top: 10px; left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 5;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="overlay-inicio">
        <h2>Escala de habitacion</h2>
        <p id="indicaciones">
            Este ejemplo demuestra el uso de un espacio de referencia de "piso local"
            para proporcionar seguimiento a escala de la habitacion.
            Monoscopico: solo gira el telefono, la posicion esta bloqueada.
        </p>
        <button id="btn-entrar">INICIAR EXPERIENCIA</button>
    </div>
    <div id="info">Cargando...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "./build/three.module.js",
            "three/addons/": "./jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer;
        let gl = null;
        let xrSession = null;
        let xrRefSpace = null;
        let xrGlLayer = null;
        let modeloEscena = null;
        let boundsLine = null;

        const btnEntrar = document.getElementById('btn-entrar');
        const overlayInicio = document.getElementById('overlay-inicio');
        const infoDiv = document.getElementById('info');

        async function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.matrixAutoUpdate = false; // Control manual total de la matriz

            const canvas = document.createElement('canvas');
            document.body.appendChild(canvas);

            gl = canvas.getContext('webgl2', { antialias: true }) 
              || canvas.getContext('webgl', { antialias: true });

            if (!gl) {
                alert('WebGL no esta soportado en este dispositivo.');
                throw new Error('WebGL no disponible');
            }

            await gl.makeXRCompatible();

            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                context: gl,
                antialias: true, 
                alpha: false 
            });

            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(10, 25, 10);
            scene.add(dirLight);

            const texLoader = new THREE.TextureLoader();
            texLoader.load('textures/textura.png',
                (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    texture.colorSpace = THREE.SRGBColorSpace;
                    scene.background = texture;
                    scene.environment = texture;

                    const geo = new THREE.SphereGeometry(500, 60, 40);
                    geo.scale(-1, 1, 1);
                    const mat = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide,
                        depthWrite: false
                    });
                    const skyMesh = new THREE.Mesh(geo, mat);
                    skyMesh.renderOrder = -1000;
                    scene.add(skyMesh);
                },
                undefined,
                (err) => {
                    console.warn('No se pudo cargar textures/textura.png');
                    scene.background = new THREE.Color(0x111122);
                }
            );

            const loader = new GLTFLoader();
            loader.load('models/gltf/camp/ciudad.gltf',
                (gltf) => {
                    modeloEscena = gltf.scene;
                    modeloEscena.position.set(0, 0, 0);
                    modeloEscena.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material.map) node.material.map.colorSpace = THREE.SRGBColorSpace;
                        }
                    });
                    scene.add(modeloEscena);
                    infoDiv.textContent = 'Modelo cargado. Gira el telefono para explorar.';
                },
                undefined,
                (error) => {
                    console.warn('No se pudo cargar models/gltf/camp/ciudad.gltf', error);
                    infoDiv.textContent = 'Error modelo. Usando geometria de respaldo.';
                    const grupo = new THREE.Group();
                    const boxGeom = new THREE.BoxGeometry(2, 5, 2);
                    const boxMat = new THREE.MeshStandardMaterial({ color: 0x445577 });
                    for (let x = -20; x <= 20; x += 8) {
                        for (let z = -20; z <= 20; z += 8) {
                            if (x === 0 && z === 0) continue;
                            const edif = new THREE.Mesh(boxGeom, boxMat);
                            edif.position.set(x, 2.5, z);
                            grupo.add(edif);
                        }
                    }
                    modeloEscena = grupo;
                    scene.add(modeloEscena);
                }
            );

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function dibujarLimites(refSpace) {
            if (!refSpace.boundsGeometry || refSpace.boundsGeometry.length === 0) return;

            const puntos = [];
            const geom = refSpace.boundsGeometry;
            for (let i = 0; i < geom.length; i++) {
                const p1 = geom[i];
                const p2 = geom[(i + 1) % geom.length];
                puntos.push(new THREE.Vector3(p1.x, p1.y, p1.z));
                puntos.push(new THREE.Vector3(p2.x, p2.y, p2.z));
            }

            const lineGeo = new THREE.BufferGeometry().setFromPoints(puntos);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00 });
            boundsLine = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(boundsLine);

            refSpace.onreset = (evt) => {
                if (boundsLine) scene.remove(boundsLine);
                dibujarLimites(evt.referenceSpace);
            };
        }

        async function iniciarExperiencia() {
            if (!navigator.xr) {
                alert('WebXR no esta soportado en este navegador.');
                return;
            }

            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!supported) {
                    alert('immersive-ar no esta soportado. Usa Chrome en Android con ARCore.');
                    return;
                }

                overlayInicio.style.display = 'none';
                infoDiv.style.display = 'block';
                infoDiv.textContent = 'Iniciando ARCore...';

                await initThree();

                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['bounded-floor']
                });

                xrGlLayer = new XRWebGLLayer(xrSession, gl);
                xrSession.updateRenderState({ baseLayer: xrGlLayer });

                try {
                    const boundedRefSpace = await xrSession.requestReferenceSpace('bounded-floor');
                    xrRefSpace = boundedRefSpace;
                    infoDiv.textContent = 'Espacio delimitado detectado.';
                    dibujarLimites(boundedRefSpace);
                } catch (e) {
                    console.log('Falling back to local-floor reference space');
                    infoDiv.textContent = 'Usando local-floor (sin limites de habitacion).';
                    xrRefSpace = await xrSession.requestReferenceSpace('local-floor');
                }

                xrSession.requestAnimationFrame(onXRFrame);

            } catch (err) {
                console.error(err);
                infoDiv.textContent = 'Error: ' + err.message;
                alert('Error al iniciar: ' + err.message);
            }
        }

        function onXRFrame(time, frame) {
            const session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            const pose = frame.getViewerPose(xrRefSpace);
            if (!pose || pose.views.length === 0) return;

            const view = pose.views[0];
            const viewport = xrGlLayer.getViewport(view);

            gl.bindFramebuffer(gl.FRAMEBUFFER, xrGlLayer.framebuffer);
            gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

            // ============================================================
            // SOLUCION ROBUSTA: Usar la view matrix de WebXR directamente.
            // La view matrix (inverse.matrix) transforma del mundo a la camara.
            // Extraemos la rotacion pura (3x3) y reconstruimos una view matrix
            // con posicion fija (0, 1.6, 0). Sin descomponer a Euler/quaternion.
            // ============================================================
            
            // View matrix original de WebXR
            const vm = new THREE.Matrix4().fromArray(view.transform.inverse.matrix);
            
            // Extraer la rotacion (3x3 superior). En una view matrix ortonormal,
            // los ejes de la camara son las filas (o columnas, dependiendo de row/column major).
            // Three.js usa column-major. Los elementos 0,1,2 son la primera columna = eje X de la camara.
            const r00 = vm.elements[0], r10 = vm.elements[1], r20 = vm.elements[2];
            const r01 = vm.elements[4], r11 = vm.elements[5], r21 = vm.elements[6];
            const r02 = vm.elements[8], r12 = vm.elements[9], r22 = vm.elements[10];

            // Posicion fija de la camara: (0, 1.6, 0)
            // En una view matrix: columnas 0,1,2 son los ejes de la camara.
            // La traslacion es: t = -R^T * p, donde p es la posicion de la camara.
            // Como R es ortonormal y en column-major, R^T es la matriz de rotacion transpuesta.
            const px = 0, py = 1.6, pz = 0;
            const tx = -(r00 * px + r01 * py + r02 * pz);
            const ty = -(r10 * px + r11 * py + r12 * pz);
            const tz = -(r20 * px + r21 * py + r22 * pz);

            // Construir la view matrix corregida con posicion fija
            const fixedVM = new THREE.Matrix4();
            fixedVM.set(
                r00, r01, r02, tx,
                r10, r11, r12, ty,
                r20, r21, r22, tz,
                0,   0,   0,   1
            );

            // Aplicar directamente a la camara de Three.js
            camera.matrixWorldInverse.copy(fixedVM);
            camera.matrixWorld.copy(fixedVM).invert();
            camera.matrix.copy(camera.matrixWorld);
            
            // Extraer position/quaternion/scale para consistencia interna
            const _p = new THREE.Vector3();
            const _q = new THREE.Quaternion();
            const _s = new THREE.Vector3();
            camera.matrix.decompose(_p, _q, _s);

            camera.projectionMatrix.fromArray(view.projectionMatrix);
            camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

            renderer.render(scene, camera);
        }

        btnEntrar.addEventListener('click', iniciarExperiencia);
    </script>
</body>
</html>
